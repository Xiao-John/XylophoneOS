name: Glibc SDK prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SDK tag (new, or an existing draft when recovering)
        required: true
        type: string
        default: xos-sdk-glibc-preview-3
      recover_existing:
        description: Revalidate and publish an existing draft without rebuilding
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glibc-sdk-prerelease
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refuse an existing release or tag
        if: ${{ !inputs.recover_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^xos-sdk-glibc-preview-[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-refs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          refs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'tag-refs.json').read_text())
          assert not any(x['ref'] == 'refs/tags/' + os.environ['RELEASE_TAG'] for x in refs), 'tag already exists'
          PY
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags.txt"; then
            echo 'release already exists' >&2
            exit 1
          fi
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap zstd
      - name: Check unprivileged SDK host startup
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 -c 'import hashlib, sys; assert sys.version_info[:2] == (3, 12); assert callable(hashlib.file_digest); print(sys.version)'
          bwrap --die-with-parent --unshare-user --unshare-pid --unshare-ipc --unshare-uts \
            --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --clearenv /usr/bin/true
      - name: Build and qualify the finished SDK
        if: ${{ !inputs.recover_existing }}
        run: |
          python3 scripts/build_glibc_host_sdk.py build \
            --tag "$RELEASE_TAG" --workdir "$RUNNER_TEMP/host-sdk-work" \
            --output "$RUNNER_TEMP/host-sdk-release" --jobs 2
      - name: Publish the qualified prerelease
        if: ${{ !inputs.recover_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/host-sdk-release"
          sha256sum -c SHA256SUMS
          # Creating the ref is atomic and fails if anyone claimed this tag
          # after preflight. Never update an existing ref or release.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          # --draft prevents partial uploads becoming a public release.
          gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --draft --prerelease \
            --latest=false --title "$RELEASE_TAG" --notes-file release-notes.md \
            "$RELEASE_TAG-linux-x86_64.tar.zst" "$RELEASE_TAG-sources.tar.zst" \
            package.json qualification.json SHA256SUMS
          # The tag endpoint only resolves published releases. Resolve this
          # authenticated draft by its exact pending tag, then use its ID.
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/uploaded-release.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-ref.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'uploaded-release.json').read_text())
          names = [tag + '-linux-x86_64.tar.zst', tag + '-sources.tar.zst', 'package.json', 'qualification.json', 'SHA256SUMS']
          assert release['tag_name'] == tag and release['draft'] and release['prerelease']
          ref = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-ref.json').read_text())
          assert ref['ref'] == 'refs/tags/' + tag and ref['object']['type'] == 'commit'
          assert ref['object']['sha'] == os.environ['GITHUB_SHA']
          assert {x['name']: x['size'] for x in release['assets']} == {n: Path(n).stat().st_size for n in names}
          for asset in release['assets']:
              with Path(asset['name']).open('rb') as stream:
                  assert asset['digest'] == 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
          report = json.loads(Path('qualification.json').read_text())
          assert report['status'] == 'passed' and report['fresh_extraction_verified']
          assert report['source_commit'] == os.environ['GITHUB_SHA']
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease
      - name: Download and verify the existing draft
        if: ${{ inputs.recover_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/recover_glibc_sdk_release.py download \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --directory "$RUNNER_TEMP/sdk-recovery"
      - name: Requalify the original SDK in a fresh consumer
        if: ${{ inputs.recover_existing }}
        run: |
          python3 scripts/recover_glibc_sdk_release.py qualify \
            --directory "$RUNNER_TEMP/sdk-recovery"
      - name: Recheck and publish the existing draft
        if: ${{ inputs.recover_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/recover_glibc_sdk_release.py publish \
            --directory "$RUNNER_TEMP/sdk-recovery"
