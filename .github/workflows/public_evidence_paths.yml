name: Public evidence paths

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the path and evidence checkers
        run: |
          python3 -m unittest discover -s tests -p 'test_public_evidence_paths.py'
          python3 -m unittest discover -s tests -p 'test_verify_evidence_index.py'
          python3 -m unittest discover -s tests -p 'test_evidence_host_command_templates.py'
          python3 -m unittest discover -s tests -p 'test_verify_evidence_migration.py'
          python3 -m unittest discover -s tests -p 'test_review_evidence_guest_findings.py'
      - name: Scan proposed file bytes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          base=$(git merge-base "$BASE_SHA" HEAD)
          if git cat-file -e "$BASE_SHA:tests/check_public_evidence_paths.py" 2>/dev/null; then
            git show "$BASE_SHA:tests/check_public_evidence_paths.py" > "$RUNNER_TEMP/check_public_evidence_paths.py"
          else
            cp tests/check_public_evidence_paths.py "$RUNNER_TEMP/check_public_evidence_paths.py"
          fi
          if python3 "$RUNNER_TEMP/check_public_evidence_paths.py" --root "$GITHUB_WORKSPACE" --commit HEAD --base "$base" --output "$RUNNER_TEMP/path-scan.json"; then
            cat "$RUNNER_TEMP/path-scan.json"
          elif git cat-file -e "$BASE_SHA:scripts/review_evidence_guest_findings.py" 2>/dev/null &&
               git cat-file -e HEAD:docs/evidence_exports/issue37/reviewed_guest_findings.json 2>/dev/null; then
            trusted="$RUNNER_TEMP/trusted-evidence"
            for file in scripts/review_evidence_guest_findings.py scripts/verify_evidence_migration.py scripts/evidence_host_command_templates.py scripts/verify_evidence_index.py tests/check_public_evidence_paths.py; do
              mkdir -p "$trusted/$(dirname "$file")"
              git show "$BASE_SHA:$file" > "$trusted/$file"
            done
            if ! python3 "$trusted/scripts/review_evidence_guest_findings.py" --root "$GITHUB_WORKSPACE" --commit HEAD --base "$base"; then
              cat "$RUNNER_TEMP/path-scan.json"
              exit 1
            fi
          else
            cat "$RUNNER_TEMP/path-scan.json"
            exit 1
          fi
